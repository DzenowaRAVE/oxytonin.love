version: '3.8'

networks:
  web_network:
    name: web_network

services:
  # 1. Reverse Proxy (Handles incoming traffic & routes subdomains)
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - '80:80'    # Public HTTP
      - '81:81'    # Admin Dashboard
      - '443:443'  # Public HTTPS
    volumes:
      - ./proxy_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - web_network

  # 2. Your First Website
  first_site:
    image: nginx:alpine
    container_name: my_first_website
    restart: always
    volumes:
      - ./site1_html:/usr/share/nginx/html
    networks:
      - web_network

  # 3. Your Second Website (test)
  second_site:
    image: nginx:alpine
    container_name: my_second_website
    restart: always
    volumes:
      - ./site2_html:/usr/share/nginx/html
    networks:
      - web_network

  # 4. SearXNG Metasearch Engine
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: always
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=https://search.oxytonin.love/
    networks:
      - web_network
